<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar Smart Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #050510;
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
            position: relative;
        }

        #stars {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        .nebula {
            position: fixed;
            border-radius: 50%;
            filter: blur(130px);
            opacity: 0.3;
            z-index: 0;
            animation: pulse 8s ease-in-out infinite alternate;
        }
        .n1 { width: 520px; height: 520px; background: radial-gradient(circle, rgba(255,140,0,0.2), transparent 70%); top: -12%; right: -6%; }
        .n2 { width: 620px; height: 620px; background: radial-gradient(circle, #0f2a4a, transparent 70%); bottom: -18%; left: -10%; animation-delay: 3s; }
        .n3 { width: 340px; height: 340px; background: radial-gradient(circle, rgba(255,193,7,0.12), transparent 70%); top: 55%; left: 58%; animation-delay: 5s; }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.22; }
            100% { transform: scale(1.18); opacity: 0.36; }
        }

        .card {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 64px 56px;
            border-radius: 28px;
            background: rgba(255,255,255,0.025);
            border: 1px solid rgba(255,255,255,0.055);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            max-width: 660px;
            width: 92%;
            animation: enter 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(36px) scale(0.97);
        }

        @keyframes enter {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Sun icon */
        .sun {
            width: 68px; height: 68px;
            margin: 0 auto 30px;
            position: relative;
            animation: spin 22s linear infinite, glow 3s ease-in-out infinite alternate;
        }
        .sun .core {
            position: absolute;
            top: 50%; left: 50%;
            width: 20px; height: 20px;
            background: #ffb300;
            border-radius: 50%;
            transform: translate(-50%,-50%);
            box-shadow: 0 0 22px #ffb300, 0 0 44px rgba(255,179,0,0.35);
        }
        .sun .ray {
            position: absolute;
            top: 50%; left: 50%;
            width: 2px; height: 30px;
            background: linear-gradient(to top, rgba(255,179,0,0.5), transparent);
            transform-origin: bottom center;
            border-radius: 2px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes glow {
            0% { filter: drop-shadow(0 0 6px rgba(255,179,0,0.25)); }
            100% { filter: drop-shadow(0 0 18px rgba(255,179,0,0.55)); }
        }

        .title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: clamp(26px, 5vw, 44px);
            letter-spacing: 3px;
            line-height: 1.2;
            margin-bottom: 22px;
            background: linear-gradient(135deg, #ffffff 0%, #ffb300 50%, #ff8f00 100%);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 4s ease-in-out infinite alternate;
        }
        @keyframes shimmer {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        .sub {
            font-weight: 300;
            font-size: clamp(12px, 1.8vw, 15px);
            color: rgba(255,255,255,0.45);
            line-height: 1.75;
            margin-bottom: 48px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
            animation: fadeUp 1.1s 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(18px);
        }
        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

        .sub .hl { color: rgba(255,179,0,0.7); font-weight: 600; }

        .btns {
            display: flex;
            gap: 18px;
            justify-content: center;
            flex-wrap: wrap;
            animation: fadeUp 1.1s 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(18px);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 17px 42px;
            border-radius: 14px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 2px;
            text-decoration: none;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            border: none;
            outline: none;
        }

        .btn::before {
            content: '';
            position: absolute;
            inset: 0;
            left: -100%;
            width: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.55s ease;
        }
        .btn:hover::before { left: 100%; }

        .btn-website {
            background: linear-gradient(135deg, #ff8f00, #ffb300);
            color: #0a0a0a;
            box-shadow: 0 4px 28px rgba(255,143,0,0.22), 0 0 0 1px rgba(255,179,0,0.18);
        }
        .btn-website:hover {
            transform: translateY(-3px) scale(1.04);
            box-shadow: 0 10px 44px rgba(255,143,0,0.38), 0 0 80px rgba(255,179,0,0.12);
        }

        .btn-feedback {
            background: transparent;
            color: rgba(255,255,255,0.82);
            border: 1.5px solid rgba(255,255,255,0.13);
            box-shadow: 0 4px 24px rgba(0,0,0,0.3);
        }
        .btn-feedback:hover {
            transform: translateY(-3px) scale(1.04);
            border-color: rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.04);
            color: #fff;
            box-shadow: 0 10px 44px rgba(255,255,255,0.05);
        }

        .btn:active { transform: translateY(0) scale(0.97) !important; }
        .btn:focus-visible { outline: 2px solid #ffb300; outline-offset: 4px; }

        /* Floating particles */
        .ptc {
            position: fixed;
            border-radius: 50%;
            background: rgba(255,179,0,0.55);
            z-index: 1;
            pointer-events: none;
            animation: rise linear infinite;
        }
        @keyframes rise {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            8% { opacity: 1; }
            92% { opacity: 1; }
            100% { transform: translateY(-110vh) translateX(30px); opacity: 0; }
        }

        /* Shooting stars */
        .shoot {
            position: fixed;
            height: 1px;
            background: linear-gradient(to right, rgba(255,255,255,0.65), transparent);
            z-index: 1;
            opacity: 0;
            pointer-events: none;
        }
        .shoot-1 { width: 90px; top: 14%; left: 18%; animation: fly 7s 2s ease-in infinite; transform: rotate(-34deg); }
        .shoot-2 { width: 70px; top: 42%; left: 68%; animation: fly 7s 5.5s ease-in infinite; transform: rotate(-42deg); }
        @keyframes fly {
            0% { opacity: 0; transform: rotate(-34deg) translateX(0); }
            2% { opacity: 1; }
            7% { opacity: 0; transform: rotate(-34deg) translateX(320px); }
            100% { opacity: 0; }
        }

        /* Bottom accent line */
        .line {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            height: 2px;
            width: 56px;
            background: linear-gradient(to right, transparent, rgba(255,179,0,0.25), transparent);
            border-radius: 2px;
            z-index: 10;
            animation: breathe 3.5s ease-in-out infinite;
        }
        @keyframes breathe {
            0%, 100% { opacity: 0.3; width: 56px; }
            50% { opacity: 0.65; width: 96px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        @media (max-width: 500px) {
            .card { padding: 44px 24px; }
            .btn { padding: 14px 28px; font-size: 12px; letter-spacing: 1.5px; }
            .btns { gap: 12px; }
        }
    </style>
</head>
<body>

    <canvas id="stars" aria-hidden="true"></canvas>
    <div class="nebula n1" aria-hidden="true"></div>
    <div class="nebula n2" aria-hidden="true"></div>
    <div class="nebula n3" aria-hidden="true"></div>
    <div class="shoot shoot-1" aria-hidden="true"></div>
    <div class="shoot shoot-2" aria-hidden="true"></div>

    <main class="card">
        <div class="sun" aria-hidden="true">
            <div class="core"></div>
        </div>

        <h1 class="title">Solar Smart Home</h1>

        <p class="sub">
            The Core Four &mdash;
            <span class="hl">Aashman Bhardwaj</span> (Leader),
            Erra Sen,
            Maanya Singh Parihar
            And Prayag Bachani
        </p>

        <div class="btns">
            <a href="https://aashman-bhardwaj.github.io/solar-smart-home/index.html"
               class="btn btn-website" target="_blank" rel="noopener noreferrer"
               aria-label="Visit the Solar Smart Home website">
                &#9788; Website
            </a>
            <a href="https://aashman-bhardwaj.github.io/customer-form/index.html"
               class="btn btn-feedback" target="_blank" rel="noopener noreferrer"
               aria-label="Go to the feedback form">
                &#9993; Feedback
            </a>
        </div>
    </main>

    <div class="line" aria-hidden="true"></div>

    <script>
        /* ── Starfield ── */
        const c = document.getElementById('stars');
        const ctx = c.getContext('2d');
        let stars = [];
        const N = 260;

        function resize() { c.width = innerWidth; c.height = innerHeight; }

        function seed() {
            stars = [];
            for (let i = 0; i < N; i++) {
                stars.push({
                    x: Math.random() * c.width,
                    y: Math.random() * c.height,
                    r: Math.random() * 1.3 + 0.2,
                    a: Math.random() * 0.75 + 0.2,
                    sp: Math.random() * 0.018 + 0.004,
                    ph: Math.random() * Math.PI * 2
                });
            }
        }

        function draw(t) {
            ctx.clearRect(0, 0, c.width, c.height);
            for (const s of stars) {
                const f = Math.sin(t * s.sp + s.ph);
                const a = s.a * (0.6 + 0.4 * f);
                const r = Math.max(0.1, s.r * (0.85 + 0.15 * f));
                ctx.beginPath();
                ctx.arc(s.x, s.y, r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255,255,255,${a.toFixed(3)})`;
                ctx.fill();
                if (s.r > 1.05) {
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, r * 2.8, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255,228,170,${(a * 0.07).toFixed(4)})`;
                    ctx.fill();
                }
            }
            requestAnimationFrame(draw);
        }

        resize(); seed(); requestAnimationFrame(draw);
        addEventListener('resize', () => { resize(); seed(); });

        /* ── Sun rays ── */
        const sun = document.querySelector('.sun');
        for (let i = 0; i < 8; i++) {
            const r = document.createElement('div');
            r.className = 'ray';
            r.style.transform = `translate(-50%, -100%) rotate(${i * 45}deg)`;
            sun.appendChild(r);
        }

        /* ── Floating particles ── */
        function spawn() {
            const p = document.createElement('div');
            p.className = 'ptc';
            const size = Math.random() * 2.2 + 0.8;
            p.style.width = size + 'px';
            p.style.height = size + 'px';
            p.style.left = Math.random() * innerWidth + 'px';
            p.style.bottom = '-4px';
            const dur = Math.random() * 9 + 6;
            p.style.animationDuration = dur + 's';
            document.body.appendChild(p);
            setTimeout(() => p.remove(), dur * 1000);
        }

        setInterval(spawn, 750);
        for (let i = 0; i < 14; i++) setTimeout(spawn, i * 180);
    </script>
</body>
</html>

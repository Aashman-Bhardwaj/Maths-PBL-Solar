<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar Smart Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #050510;
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
            position: relative;
        }

        #starfield {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
        }

        .nebula {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.35;
            z-index: 0;
            animation: nebulaPulse 8s ease-in-out infinite alternate;
        }

        .nebula-1 {
            width: 500px; height: 500px;
            background: radial-gradient(circle, #ff6a0033, transparent 70%);
            top: -10%; right: -5%;
        }

        .nebula-2 {
            width: 600px; height: 600px;
            background: radial-gradient(circle, #1a3a5c, transparent 70%);
            bottom: -15%; left: -10%;
            animation-delay: 3s;
        }

        .nebula-3 {
            width: 350px; height: 350px;
            background: radial-gradient(circle, #ffc10722, transparent 70%);
            top: 50%; left: 60%;
            animation-delay: 5s;
        }

        @keyframes nebulaPulse {
            0% { transform: scale(1); opacity: 0.25; }
            100% { transform: scale(1.2); opacity: 0.4; }
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 60px 50px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            max-width: 720px;
            width: 90%;
            animation: containerIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(40px) scale(0.96);
        }

        @keyframes containerIn {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .solar-icon {
            width: 64px; height: 64px;
            margin: 0 auto 28px;
            position: relative;
            animation: iconSpin 20s linear infinite, iconGlow 3s ease-in-out infinite alternate;
        }

        .solar-icon .core {
            position: absolute;
            top: 50%; left: 50%;
            width: 18px; height: 18px;
            background: #ffb300;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 20px #ffb300, 0 0 40px rgba(255, 179, 0, 0.4);
        }

        .solar-icon .ray {
            position: absolute;
            top: 50%; left: 50%;
            width: 2px; height: 28px;
            background: linear-gradient(to top, #ffb30088, transparent);
            transform-origin: bottom center;
            border-radius: 2px;
        }

        @keyframes iconSpin { to { transform: rotate(360deg); } }
        @keyframes iconGlow {
            0% { filter: drop-shadow(0 0 8px rgba(255, 179, 0, 0.3)); }
            100% { filter: drop-shadow(0 0 20px rgba(255, 179, 0, 0.6)); }
        }

        .title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: clamp(28px, 5vw, 46px);
            color: #f0f0f0;
            letter-spacing: 3px;
            margin-bottom: 20px;
            line-height: 1.2;
            background: linear-gradient(135deg, #ffffff 0%, #ffb300 50%, #ff8f00 100%);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: titleShimmer 4s ease-in-out infinite alternate;
        }

        @keyframes titleShimmer {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        .subtitle {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 300;
            font-size: clamp(13px, 2vw, 16px);
            color: rgba(255, 255, 255, 0.5);
            line-height: 1.7;
            margin-bottom: 44px;
            max-width: 520px;
            margin-left: auto;
            margin-right: auto;
            animation: subtitleIn 1.2s 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes subtitleIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .subtitle .highlight {
            color: rgba(255, 179, 0, 0.7);
            font-weight: 600;
        }

        .buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
            animation: buttonsIn 1.2s 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes buttonsIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 16px 36px;
            border-radius: 14px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 1.5px;
            text-decoration: none;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            border: none;
            outline: none;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.6s ease;
        }

        .btn:hover::before { left: 100%; }

        .btn-website {
            background: linear-gradient(135deg, #ff8f00, #ffb300);
            color: #0a0a0a;
            box-shadow: 0 4px 24px rgba(255, 143, 0, 0.25), 0 0 0 1px rgba(255, 179, 0, 0.2);
        }

        .btn-website:hover {
            transform: translateY(-3px) scale(1.04);
            box-shadow: 0 8px 40px rgba(255, 143, 0, 0.4), 0 0 80px rgba(255, 179, 0, 0.15);
        }

        .btn-feedback {
            background: transparent;
            color: rgba(255, 255, 255, 0.85);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
        }

        .btn-feedback:hover {
            transform: translateY(-3px) scale(1.04);
            border-color: rgba(255, 255, 255, 0.35);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
        }

        .btn-ppt {
            background: linear-gradient(135deg, #1a3a5c, #0d7377);
            color: #e0f7fa;
            box-shadow: 0 4px 24px rgba(13, 115, 119, 0.3), 0 0 0 1px rgba(13, 115, 119, 0.3);
        }

        .btn-ppt:hover {
            transform: translateY(-3px) scale(1.04);
            box-shadow: 0 8px 40px rgba(13, 115, 119, 0.45), 0 0 80px rgba(13, 115, 119, 0.15);
        }

        .btn:active { transform: translateY(0) scale(0.98) !important; }
        .btn:focus-visible { outline: 2px solid #ffb300; outline-offset: 4px; }
        .btn .btn-icon { font-size: 18px; }

        .particle {
            position: fixed;
            width: 2px; height: 2px;
            background: rgba(255, 179, 0, 0.6);
            border-radius: 50%;
            z-index: 1;
            animation: floatParticle linear infinite;
            pointer-events: none;
        }

        @keyframes floatParticle {
            0% { transform: translateY(100vh) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) translateX(40px); opacity: 0; }
        }

        .shooting-star {
            position: fixed;
            width: 80px; height: 1px;
            background: linear-gradient(to right, rgba(255,255,255,0.7), transparent);
            z-index: 1;
            opacity: 0;
            pointer-events: none;
        }

        .shooting-star:nth-child(1) {
            top: 15%; left: 20%;
            animation: shoot 6s 2s ease-in infinite;
            transform: rotate(-35deg);
        }

        .shooting-star:nth-child(2) {
            top: 40%; left: 70%;
            animation: shoot 6s 5s ease-in infinite;
            transform: rotate(-40deg);
        }

        @keyframes shoot {
            0% { opacity: 0; transform: rotate(-35deg) translateX(0); }
            2% { opacity: 1; }
            8% { opacity: 0; transform: rotate(-35deg) translateX(300px); }
            100% { opacity: 0; }
        }

        .bottom-line {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px; height: 2px;
            background: linear-gradient(to right, transparent, rgba(255, 179, 0, 0.3), transparent);
            border-radius: 2px;
            z-index: 10;
            animation: linePulse 3s ease-in-out infinite;
        }

        @keyframes linePulse {
            0%, 100% { opacity: 0.3; width: 60px; }
            50% { opacity: 0.7; width: 100px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        @media (max-width: 600px) {
            .container { padding: 40px 24px; }
            .btn { padding: 13px 24px; font-size: 12px; letter-spacing: 1px; }
            .buttons { gap: 12px; }
        }
    </style>
</head>
<body>

    <canvas id="starfield" aria-hidden="true"></canvas>
    <div class="nebula nebula-1" aria-hidden="true"></div>
    <div class="nebula nebula-2" aria-hidden="true"></div>
    <div class="nebula nebula-3" aria-hidden="true"></div>
    <div class="shooting-star" aria-hidden="true"></div>
    <div class="shooting-star" aria-hidden="true"></div>

    <main class="container" role="main">
        <div class="solar-icon" aria-hidden="true">
            <div class="core"></div>
        </div>

        <h1 class="title">Solar Smart Home</h1>

        <p class="subtitle">
            The Core Four &mdash;
            <span class="highlight">Aashman Bhardwaj</span> (Leader),
            Erra Sen,
            Maanya Singh Parihar
            And Prayag Bachani
        </p>

        <div class="buttons">
            <a href="https://aashman-bhardwaj.github.io/solar-smart-home/index.html"
               class="btn btn-website" target="_blank" rel="noopener noreferrer"
               aria-label="Visit the Solar Smart Home website">
                <span class="btn-icon">&#9788;</span> Website
            </a>
            <a href="https://aashman-bhardwaj.github.io/customer-form/index.html"
               class="btn btn-feedback" target="_blank" rel="noopener noreferrer"
               aria-label="Go to the feedback form">
                <span class="btn-icon">&#9993;</span> Feedback
            </a>
            <a href="presentation.html" class="btn btn-ppt"
               aria-label="View the PPT presentation">
                <span class="btn-icon">&#9654;</span> Presentation
            </a>
        </div>
    </main>

    <div class="bottom-line" aria-hidden="true"></div>

    <script>
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let stars = [];
        const STAR_COUNT = 280;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function createStars() {
            stars = [];
            for (let i = 0; i < STAR_COUNT; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 1.4 + 0.2,
                    alpha: Math.random() * 0.8 + 0.2,
                    twinkleSpeed: Math.random() * 0.02 + 0.005,
                    twinklePhase: Math.random() * Math.PI * 2
                });
            }
        }

        function drawStars(time) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (const star of stars) {
                const flicker = Math.sin(time * star.twinkleSpeed + star.twinklePhase);
                const alpha = star.alpha * (0.6 + 0.4 * flicker);
                const r = Math.max(0.1, star.radius * (0.85 + 0.15 * flicker));
                ctx.beginPath();
                ctx.arc(star.x, star.y, r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255,255,255,${alpha.toFixed(3)})`;
                ctx.fill();
                if (star.radius > 1.0) {
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, r * 3, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255,230,180,${(alpha * 0.08).toFixed(4)})`;
                    ctx.fill();
                }
            }
            requestAnimationFrame(drawStars);
        }

        resizeCanvas();
        createStars();
        requestAnimationFrame(drawStars);
        window.addEventListener('resize', () => { resizeCanvas(); createStars(); });

        // Solar icon rays
        const solarIcon = document.querySelector('.solar-icon');
        for (let i = 0; i < 8; i++) {
            const ray = document.createElement('div');
            ray.classList.add('ray');
            ray.style.transform = `translate(-50%, -100%) rotate(${i * 45}deg)`;
            solarIcon.appendChild(ray);
        }

        // Floating particles
        function spawnParticle() {
            const p = document.createElement('div');
            p.classList.add('particle');
            p.style.left = Math.random() * window.innerWidth + 'px';
            const size = Math.random() * 2 + 1;
            p.style.width = size + 'px';
            p.style.height = size + 'px';
            const dur = Math.random() * 8 + 6;
            p.style.animationDuration = dur + 's';
            document.body.appendChild(p);
            setTimeout(() => p.remove(), dur * 1000);
        }

        setInterval(spawnParticle, 800);
        for (let i = 0; i < 12; i++) setTimeout(spawnParticle, i * 200);
    </script>
</body>
</html>
